<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Viewer</title>
<script>try{if(localStorage.getItem('pdfv-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --bar:#f7f7f7;
  --stage:#e6e6e6;
  --line:#d4d4d4;
  --text:#1f1f1f;
  --muted:#616161;
  --hover:#e8e8e8;
  --active:#dcdcdc;
  --field:#ffffff;
  --focus:#0f6cbd;
  --menu:#ffffff;
  --edge:#d6d6d6;
  --border:#c4c4c4;
  --label:#424242;
  --scroll:#b5b5b5;
  --ring:#424242;
  --err:#c42b1c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bar:#2b2b2b;
  --stage:#323232;
  --line:#4b4b4b;
  --text:#f3f3f3;
  --muted:#aaaaaa;
  --hover:#3f3f3f;
  --active:#515151;
  --field:#1f1f1f;
  --focus:#4cc2ff;
  --menu:#383838;
  --edge:#4a4a4a;
  --border:#666666;
  --label:#dddddd;
  --scroll:#707070;
  --ring:#e9e9e9;
  --err:#ff8a8a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bar)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--stage);color:var(--text);overflow:hidden;
  font:13px/1.3 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

.app{height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- toolbar ---------- */
.toolbar{
  flex:none;height:38px;background:var(--bar);display:flex;align-items:center;
  padding:0 8px;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  border-bottom:1px solid var(--edge);
}
.toolbar::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:2px;flex:none}
.spacer{flex:1 0 6px}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.tb{
  background:none;border:0;height:30px;min-width:30px;padding:0 6px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex:none;white-space:nowrap;
}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"],.tb.on,.tb[aria-expanded="true"]{background:var(--active)}
.tb:focus-visible,.pageIn:focus-visible,.find input:focus-visible,.menu button:focus-visible,.dlg input:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tb.caret{min-width:18px;padding:0 3px;margin-left:-4px}
.tb.caret svg{width:10px;height:10px}
.tb svg{width:18px;height:18px;flex:none}
.tb.lbl{padding:0 8px}
.needs-doc{transition:opacity .15s}
.app:not(.has-doc) .needs-doc{opacity:.38;pointer-events:none}
.pageIn{
  width:38px;height:26px;text-align:center;background:var(--field);border:1px solid var(--border);border-radius:3px;
  padding:0;-moz-appearance:textfield;appearance:textfield;
}
.pageIn::-webkit-inner-spin-button,.pageIn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.of{margin:0 8px 0 6px;white-space:nowrap}
.swatch-dot{width:8px;height:8px;border-radius:50%;position:absolute;right:3px;bottom:5px;border:1px solid rgba(0,0,0,.4)}
.tb{position:relative}

/* ---------- menus ---------- */
.menu{
  position:fixed;z-index:30;background:var(--menu);border:1px solid var(--edge);border-radius:8px;padding:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:176px;
}
.menu h4{margin:2px 4px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.cp{width:262px;background:var(--menu);padding:14px 16px 16px;max-height:calc(100vh - 56px);overflow:auto}
.cp h4{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--text)}
.cp h4.second{margin-top:16px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;justify-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw:hover{transform:scale(1.06)}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--menu),0 0 0 4px var(--ring)}
.sw.wheel-btn{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.more{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.more span{color:var(--label)}
.wheelWrap{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.wheelBox{position:relative;width:176px;height:176px;touch-action:none}
.wheelBox canvas{width:176px;height:176px;border-radius:50%;display:block;cursor:crosshair}
.wheelBox .mk{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
.vrow{display:flex;align-items:center;gap:8px;width:100%}
.vrow label{color:var(--label);width:62px}
.vrow input[type=range]{flex:1}
.hexIn{width:84px;height:26px;background:var(--field);border:1px solid var(--border);border-radius:4px;padding:0 6px;text-align:center;font-variant-numeric:tabular-nums}
.prev{display:block;width:100%;height:46px;margin:14px 0 0}
.thick{width:100%;margin:2px 0 0;height:22px;background:none;-webkit-appearance:none;appearance:none}
.thick::-webkit-slider-runnable-track{height:3px;background:#b0b0b0;border-radius:2px}
.thick::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7.5px;border:1px solid #8a8a8a}
.thick::-moz-range-track{height:3px;background:#b0b0b0;border-radius:2px}
.thick::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #8a8a8a}
.vrow input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:22px}
.vrow input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#000,#fff);border-radius:3px}
.vrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5px;border:1px solid #333}
.vrow input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,#000,#fff);border-radius:3px}
.vrow input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid #333}
.tl{display:flex;justify-content:space-between;font-size:12px;color:var(--label);margin-top:2px}
.mi{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-radius:5px;padding:7px 8px;text-align:left;cursor:pointer}
.mi:hover{background:var(--hover)}
.mi .chk{width:14px;flex:none;opacity:0}
.mi[aria-checked="true"] .chk{opacity:1}

/* ---------- main ---------- */
.main{flex:1;display:flex;min-height:0;position:relative}
.side{width:236px;flex:none;background:var(--bar);border-right:1px solid var(--edge);display:flex;flex-direction:column;min-height:0}
.side-head{padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;height:28px;background:none;border:0;border-radius:5px;cursor:pointer}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected="true"]{background:var(--active)}
.side-body{flex:1;overflow:auto;min-height:0;scrollbar-color:var(--scroll) var(--bar)}
.thumbs{padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.thumb{background:none;border:2px solid transparent;border-radius:4px;padding:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.thumb:hover{background:var(--hover)}
.thumb[aria-current="true"]{border-color:var(--focus)}
.thumb canvas{display:block;background:#fff}
.outline{padding:8px}
.outline ul{list-style:none;margin:0;padding:0}
.outline button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:5px 6px;cursor:pointer;overflow-wrap:anywhere}
.outline button:hover{background:var(--hover)}
.note-empty{padding:16px 14px;color:var(--muted);line-height:1.5}

.stage{
  flex:1;min-width:0;overflow:auto;position:relative;background:var(--stage);
  scrollbar-color:var(--scroll) var(--stage);outline:none;
}
.stage::-webkit-scrollbar{width:14px;height:14px}
.stage::-webkit-scrollbar-track{background:var(--stage)}
.stage::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:7px;border:3px solid var(--stage)}
.stage::-webkit-scrollbar-corner{background:var(--stage)}
.stage.drag::after{content:"";position:absolute;inset:8px;border:2px dashed var(--focus);border-radius:10px;pointer-events:none;position:fixed}

.pages{
  display:grid;grid-template-columns:repeat(var(--cols,1),max-content);justify-content:center;
  gap:8px;padding:8px 16px 20px;width:max-content;min-width:100%;position:relative;
}
.page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);overflow:hidden}
.page canvas.pdf{position:absolute;inset:0;width:100%;height:100%;display:block}
.pages.invert canvas.pdf{filter:invert(.92) hue-rotate(180deg)}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(60,150,255,.4)}
.textLayer .hit{background:rgba(255,214,0,.5);border-radius:2px}
.textLayer .cur{background:rgba(255,128,0,.7);border-radius:2px}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tlayer{position:absolute;inset:0;pointer-events:none}
.note{position:absolute;pointer-events:auto}
.note .nt{
  min-width:1.5em;padding:.06em .2em;white-space:pre;line-height:1.2;outline:1px dashed transparent;border-radius:2px;cursor:text;
  font-family:Helvetica,Arial,sans-serif;
}
.note:hover .nt,.note.active .nt{outline-color:rgba(60,150,255,.9)}
.note .grip{
  position:absolute;left:-15px;top:0;bottom:0;width:14px;min-height:18px;border-radius:4px 0 0 4px;cursor:move;touch-action:none;
  background:rgba(60,150,255,.95) radial-gradient(circle,#fff 1.1px,transparent 1.4px) center/5px 6px;opacity:0;transition:opacity .12s;
}
.note:hover .grip,.note.active .grip,.note.moving .grip{opacity:1}
.fmt{
  position:fixed;z-index:25;background:var(--menu);border:1px solid var(--edge);border-radius:8px;display:flex;align-items:center;gap:1px;
  padding:3px;box-shadow:0 6px 20px rgba(0,0,0,.14);max-width:calc(100vw - 16px)
}
.fmt .tb{height:28px;min-width:28px;padding:0 5px}
.fmt .sep{margin:0 4px;height:16px}
.fmt select{height:26px;background:var(--field);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.fmt .fsize{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.fmt .fb{font-size:14px;font-family:Georgia,"Times New Roman",serif}
.cdot{display:block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.pages[data-tool="eraser"] .nt{cursor:pointer}
.note .rs{position:absolute;touch-action:none;z-index:2}
.note .rs.e{right:-5px;top:6px;bottom:6px;width:10px;cursor:ew-resize}
.note .rs.se{right:-7px;bottom:-7px;width:13px;height:13px;cursor:nwse-resize;border-radius:50%;background:#fff;border:2px solid rgb(60,150,255);opacity:0;transition:opacity .12s}
.note:hover .rs.se,.note.active .rs.se,.note.moving .rs.se{opacity:1}
.tb:disabled{opacity:.35;cursor:default}
.tb:disabled:hover{background:none}
.pages[data-tool="draw"] .ink,.pages[data-tool="highlight"] .ink,.pages[data-tool="eraser"] .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.pages[data-tool="draw"] .textLayer,.pages[data-tool="highlight"] .textLayer,.pages[data-tool="eraser"] .textLayer{pointer-events:none}
.pages[data-tool="eraser"] .ink{cursor:cell}
.pages[data-tool="eraser"] .note{cursor:pointer}
.pages[data-tool="text"] .page{cursor:text}

/* ---------- empty state ---------- */
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:6px;
}
.empty .big{width:56px;height:56px;color:#8a8a8a;margin-bottom:6px}
.empty h1{margin:0;font-size:20px;font-weight:600}
.empty p{margin:0 0 14px;color:var(--muted);max-width:34ch;line-height:1.5}
.empty .err{color:var(--err);margin-bottom:10px}
.btn{
  background:#0f6cbd;border:0;border-radius:6px;height:34px;padding:0 18px;cursor:pointer;font-weight:600;color:#fff;
}
.btn:hover{background:#115ea3}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text);font-weight:400}
.btn.ghost:hover{background:var(--hover)}
.app.has-doc .empty{display:none}

/* ---------- find bar ---------- */
.find{
  position:absolute;top:8px;right:22px;z-index:20;background:var(--menu);border:1px solid var(--edge);border-radius:8px;
  display:flex;align-items:center;gap:2px;padding:4px 4px 4px 8px;box-shadow:0 6px 20px rgba(0,0,0,.14);
}
.find input{background:var(--field);border:1px solid var(--border);border-radius:4px;height:26px;width:190px;padding:0 8px}
.find .cnt{min-width:64px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px}

/* ---------- toast / dialog ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:#2b2b2b;color:#fff;border:1px solid #2b2b2b;border-radius:8px;padding:8px 14px;z-index:60;pointer-events:none;
  opacity:0;transition:opacity .15s;max-width:90vw;
}
.toast.show{opacity:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--menu);border:1px solid var(--edge);border-radius:10px;padding:18px;width:min(380px,100%);box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dlg h3{margin:0 0 6px;font-size:15px}
.dlg p{margin:0 0 12px;color:var(--muted)}
.dlg input{width:100%;height:32px;background:var(--field);border:1px solid var(--border);border-radius:5px;padding:0 10px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

#printArea{display:none}
@media print{
  html,body{background:#fff;overflow:visible;height:auto}
  .app,.toast,.scrim{display:none!important}
  #printArea{display:block}
  #printArea canvas{display:block;width:100%;height:auto;break-after:page;page-break-after:always}
  @page{margin:0}
}

@media (max-width:760px){
  .side{position:absolute;z-index:15;top:0;bottom:0;left:0;box-shadow:6px 0 24px rgba(0,0,0,.15)}
  .tb .t{display:none}
  .find{left:12px;right:12px}
  .find input{flex:1;width:auto;min-width:0}
}
@media (prefers-reduced-motion:reduce){.needs-doc,.toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="toolbar" id="toolbar" role="toolbar" aria-label="PDF tools">
    <div class="grp">
      <button class="tb" id="btnSide" title="Table of contents and pages" aria-label="Table of contents and pages" aria-pressed="false"><span data-i="list"></span></button>
      <span class="sep"></span>
      <span class="grp needs-doc">
        <button class="tb" id="btnHl" title="Highlight" aria-label="Highlight" aria-pressed="false"><span data-i="highlight"></span><span class="swatch-dot" id="hlDot"></span></button>
        <button class="tb caret" id="btnHlMenu" title="Highlight color" aria-label="Highlight color" aria-haspopup="true" aria-expanded="false"><span data-i="caret"></span></button>
        <button class="tb" id="btnDraw" title="Draw" aria-label="Draw" aria-pressed="false"><span data-i="draw"></span><span class="t">Draw</span></button>
        <button class="tb caret" id="btnDrawMenu" title="Draw color and thickness" aria-label="Draw color and thickness" aria-haspopup="true" aria-expanded="false"><span data-i="caret"></span></button>
        <button class="tb" id="btnErase" title="Erase annotations" aria-label="Erase annotations" aria-pressed="false"><span data-i="eraser"></span></button>
        <span class="sep"></span>
        <button class="tb" id="btnText" title="Add text" aria-label="Add text" aria-pressed="false"><span data-i="textbox"></span></button>
        <button class="tb caret" id="btnTextMenu" title="Text color and size" aria-label="Text color and size" aria-haspopup="true" aria-expanded="false"><span data-i="caret"></span></button>
        <button class="tb" id="btnRead" title="Read aloud" aria-label="Read aloud" aria-pressed="false"><span data-i="speaker"></span></button>
      </span>
    </div>

    <div class="spacer"></div>

    <div class="grp needs-doc">
      <button class="tb" id="btnZoomOut" title="Zoom out (Ctrl + −)" aria-label="Zoom out"><span data-i="minus"></span></button>
      <button class="tb" id="btnZoomIn" title="Zoom in (Ctrl + +)" aria-label="Zoom in"><span data-i="plus"></span></button>
      <button class="tb" id="btnFit" title="Fit to page width" aria-label="Fit to page"><span data-i="fit"></span></button>
      <span class="sep"></span>
      <input class="pageIn" id="pageIn" type="number" min="1" value="1" inputmode="numeric" aria-label="Page number">
      <span class="of" id="pageOf">of 1</span>
      <button class="tb" id="btnRotate" title="Rotate clockwise" aria-label="Rotate clockwise"><span data-i="rotate"></span></button>
      <button class="tb" id="btnTwo" title="Two-page view" aria-label="Two-page view" aria-pressed="false"><span data-i="twopage"></span></button>
    </div>

    <div class="spacer"></div>

    <div class="grp">
      <span class="grp needs-doc">
        <button class="tb" id="btnFind" title="Find in document (Ctrl + F)" aria-label="Find in document"><span data-i="search"></span></button>
        <span class="sep"></span>
        <button class="tb" id="btnPrint" title="Print (Ctrl + P)" aria-label="Print"><span data-i="print"></span></button>
        <button class="tb" id="btnSave" title="Save (Ctrl + S)" aria-label="Save"><span data-i="save"></span></button>
        <button class="tb" id="btnSaveAs" title="Save as" aria-label="Save as"><span data-i="saveas"></span></button>
        <button class="tb" id="btnFull" title="Full screen" aria-label="Full screen"><span data-i="full"></span></button>
      </span>
      <button class="tb" id="btnSet" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><span data-i="gear"></span></button>
      <span class="sep"></span>
      <button class="tb lbl" id="btnOpen" title="Open a PDF"><span data-i="folder"></span><span class="t">Open file</span></button>
    </div>
  </header>

  <div class="main" id="main">
    <aside class="side" id="side" hidden>
      <div class="side-head">
        <div class="fname" id="fname"></div>
        <div class="tabs" role="tablist">
          <button role="tab" id="tabOutline" aria-selected="false">Contents</button>
          <button role="tab" id="tabThumbs" aria-selected="true">Pages</button>
        </div>
      </div>
      <div class="side-body" id="sideBody">
        <div class="outline" id="outline" hidden></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </aside>

    <main class="stage" id="stage" tabindex="0" aria-label="Document">
      <div class="empty" id="empty">
        <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 14h7M9 17.5h5"/></svg>
        <h1>Open a PDF</h1>
        <p id="emptyMsg">Drop a file here, or choose one from your device. It stays in your browser.</p>
        <button class="btn" id="btnOpen2">Open file</button>
      </div>
      <div class="pages" id="pages" data-tool=""></div>
    </main>

    <div class="find" id="find" hidden>
      <input id="findIn" type="search" placeholder="Find in document" aria-label="Find in document" autocomplete="off" spellcheck="false">
      <span class="cnt" id="findCnt" aria-live="polite"></span>
      <button class="tb" id="findPrev" title="Previous match" aria-label="Previous match"><span data-i="up"></span></button>
      <button class="tb" id="findNext" title="Next match" aria-label="Next match"><span data-i="down"></span></button>
      <button class="tb" id="findClose" title="Close" aria-label="Close find"><span data-i="close"></span></button>
    </div>
  </div>
</div>

<!-- menus -->
<div class="fmt" id="fmt" role="toolbar" aria-label="Text formatting" hidden>
  <button class="tb" id="fGrip" title="Drag to move" aria-label="Move text box" style="cursor:move;touch-action:none"><span data-i="grip"></span></button>
  <span class="sep"></span>
  <select id="fFont" aria-label="Font"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option></select>
  <button class="tb" id="fMinus" title="Smaller text" aria-label="Smaller text"><span data-i="minus"></span></button>
  <span class="fsize" id="fSize" aria-live="polite">14</span>
  <button class="tb" id="fPlus" title="Larger text" aria-label="Larger text"><span data-i="plus"></span></button>
  <span class="sep"></span>
  <button class="tb fb" id="fB" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
  <button class="tb fb" id="fI" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>

function ask(opts){

    var scrim=document.createElement('div');scrim.className='scrim';
    scrim.innerHTML='<form class="dlg" role="dialog" aria-modal="true"><h3></h3><p></p><input autocomplete="off"><div class="row"><button type="button" class="btn ghost">Cancel</button><button type="submit" class="btn">'+(opts.ok||'OK')+'</button></div></form>';
    var f=scrim.firstChild;
    f.querySelector('h3').textContent=opts.title;
    f.querySelector('p').textContent=opts.text||'';
    if(!opts.text)f.querySelector('p').remove();
    var inp=f.querySelector('input');inp.type=opts.type||'text';inp.value=opts.value||'';inp.setAttribute('aria-label',opts.title);
    function done(v){scrim.remove();resolve(v)}
    f.addEventListener('submit',function(e){e.preventDefault();done(inp.value)});
    f.querySelector('.ghost').addEventListener('click',function(){done(null)});
    scrim.addEventListener('keydown',function(e){if(e.key==='Escape')done(null)});
    document.body.appendChild(scrim);inp.focus();inp.select();
  });
}

var PALETTE=[
 ['#000000','Black'],['#4d4d4f','Dark gray'],['#8c8c8e','Gray'],['#acacae','Light gray'],['#d9d9d9','Silver'],['#ffffff','White'],
 ['#b5176d','Raspberry'],['#e81d25','Red'],['#ff4d0a','Vermilion'],['#ffa400','Orange'],['#ffcc00','Gold'],['#ffe100','Yellow'],
 ['#a4e01b','Lime'],['#22ee00','Green'],['#0b8a5c','Forest'],['#00a8cc','Cyan'],['#0a4fe8','Blue'],['#4a00c8','Indigo'],
 ['#6a00d8','Violet'],['#6b0a7e','Plum'],['#f9d9c6','Peach'],['#c49a6c','Tan'],['#8c5a2b','Brown'],['#5e3a28','Dark brown'],
 ['#ff7ff2','Pink'],['#ffc98a','Apricot'],['#ffff8a','Light yellow'],['#8dff9a','Mint'],['#87d0ff','Sky'],['#c1b4ff','Lavender']
];
function hsv2rgb(h,s,v){
  var i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s),r,g,b;
  switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;default:r=v;g=p;b=q}
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
  if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6}
  return [h,mx?d/mx:0,mx];
}
function toHex(rgb){return '#'+rgb.map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
function fromHex(hx){return [parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16)]}

var panels={};
function buildPanel(el,kind){
  var isHl=kind==='hl',isTx=kind==='text';
  var toolName=isHl?'highlight':isTx?'text':'draw';
  var getC=function(){return isHl?S.hlColor:isTx?S.textColor:S.drawColor};
  var getW=function(){return isHl?S.hlW:isTx?S.textSize:S.drawW};
  var rng=isHl?[6,26,.5]:isTx?[8,72,1]:[1,14,.5];
  el.innerHTML=
    '<h4>Colors</h4><div class="pal" role="radiogroup" aria-label="Colors"></div>'+
    '<div class="more"><button type="button" class="sw wheel-btn" role="radio" aria-checked="false" aria-label="Color wheel" title="Color wheel"></button><span>Color wheel</span></div>'+
    '<div class="wheelWrap" hidden>'+
      '<div class="wheelBox"><canvas width="176" height="176" aria-label="Color wheel"></canvas><div class="mk"></div></div>'+
      '<div class="vrow"><label>Brightness</label><input type="range" class="vIn" min="0" max="100" value="100" aria-label="Brightness"></div>'+
      '<div class="vrow"><label>Hex</label><input class="hexIn" maxlength="7" spellcheck="false" aria-label="Hex color"></div>'+
    '</div>'+
    (isTx
      ?'<svg class="prev" viewBox="0 0 220 46" aria-hidden="true"><text x="110" y="31" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Sample text</text></svg>'
      :'<svg class="prev" viewBox="0 0 220 46" aria-hidden="true"><path d="M6 36C44 4 86 2 116 24S182 40 214 10" fill="none" stroke-linecap="round"/></svg>')+
    '<h4 class="second">'+(isTx?'Size':'Thickness')+'</h4>'+
    '<input type="range" class="thick" min="'+rng[0]+'" max="'+rng[1]+'" step="'+rng[2]+'" aria-label="'+(isTx?'Text size':'Thickness')+'">'+
    '<div class="tl"><span>'+(isTx?'Small':'Thin')+'</span><span>'+(isTx?'Large':'Thick')+'</span></div>';
  var pal=el.querySelector('.pal'),wheelBtn=el.querySelector('.wheel-btn'),wrap=el.querySelector('.wheelWrap');
  var cv=el.querySelector('canvas'),mk=el.querySelector('.mk'),vIn=el.querySelector('.vIn'),hexIn=el.querySelector('.hexIn');
  var prev=el.querySelector('.prev '+(isTx?'text':'path')),thick=el.querySelector('.thick');
  var hsv=[0,0,1];

  function prevColor(c){
    if(isTx)prev.setAttribute('fill',c);else prev.setAttribute('stroke',c);
  }
  function prevWidth(w){
    if(isTx){prev.setAttribute('font-size',Math.min(36,Math.max(10,w*1.5)))}
    else prev.setAttribute('stroke-width',isHl?Math.min(40,w*1.5):Math.min(22,w*1.6));
  }
  function commitColor(hex){
    if(isHl){S.hlColor=hex;$('#hlDot').style.background=hex}
    else if(isTx){
      S.textColor=hex;
      var n=S.active;if(n){n.t.color=hex;styleNote(n.t);updateBar()}
    }else S.drawColor=hex;
    setTool(toolName,true);
  }
  function commitWidth(w){
    if(isHl)S.hlW=w;else if(isTx){
      S.textSize=w;
      var n=S.active;if(n){n.t.size=w;styleNote(n.t);updateBar();positionBar()}
    }else S.drawW=w;
    setTool(toolName,true);
  }

  PALETTE.forEach(function(c){
    var b=document.createElement('button');b.type='button';b.className='sw';b.style.background=c[0];b.dataset.c=c[0];
    b.setAttribute('role','radio');b.setAttribute('aria-label',c[1]);b.title=c[1];
    b.addEventListener('click',function(){commitColor(c[0]);sync()});
    pal.appendChild(b);
  });

  function drawWheel(){
    var sz=cv.width,ctx=cv.getContext('2d'),img=ctx.createImageData(sz,sz),r=sz/2,v=hsv[2];
    for(var y=0;y<sz;y++)for(var x=0;x<sz;x++){
      var dx=x+.5-r,dy=y+.5-r,d=Math.sqrt(dx*dx+dy*dy),o=(y*sz+x)*4;
      if(d>r)continue;
      var rgb=hsv2rgb(((Math.atan2(dy,dx)/(2*Math.PI))+1)%1,Math.min(1,d/r),v);
      img.data[o]=rgb[0];img.data[o+1]=rgb[1];img.data[o+2]=rgb[2];
      img.data[o+3]=d>r-1?Math.round(255*(r-d)):255;
    }
    ctx.putImageData(img,0,0);
  }
  function placeMarker(){
    var r=cv.clientWidth/2,ang=hsv[0]*2*Math.PI,d=hsv[1]*r;
    mk.style.left=(r+Math.cos(ang)*d)+'px';mk.style.top=(r+Math.sin(ang)*d)+'px';
  }
  function checks(hex){
    var inPal=false;
    pal.querySelectorAll('.sw').forEach(function(b){var on=b.dataset.c===hex;if(on)inPal=true;b.setAttribute('aria-checked',String(on))});
    wheelBtn.setAttribute('aria-checked',String(!inPal));

  function sync(){
    var c=getC().toLowerCase();

    hsv=rgb2hsv.apply(null,fromHex(c));
    vIn.value=Math.round(hsv[2]*100);hexIn.value=c;
    if(!wrap.hidden){drawWheel();placeMarker()}
    prevColor(c);prevWidth(getW());
    thick.value=getW();
  }
  function pick(e){
    var r=cv.getBoundingClientRect(),cx=r.width/2;
    var dx=e.clientX-r.left-cx,dy=e.clientY-r.top-cx,d=Math.min(Math.hypot(dx,dy),cx);
    hsv[0]=((Math.atan2(dy,dx)/(2*Math.PI))+1)%1;hsv[1]=d/cx;
    placeMarker();
    var hex=toHex(hsv2rgb(hsv[0],hsv[1],hsv[2]));
    commitColor(hex);hexIn.value=hex;checks(hex);prevColor(hex);
  }
  var dragging=false;
  cv.addEventListener('pointerdown',function(e){dragging=true;cv.setPointerCapture(e.pointerId);pick(e)});
  cv.addEventListener('pointermove',function(e){if(dragging)pick(e)});
  cv.addEventListener('pointerup',function(){dragging=false});
  cv.addEventListener('pointercancel',function(){dragging=false});
  vIn.addEventListener('input',function(){
    hsv[2]=vIn.value/100;drawWheel();
    var hex=toHex(hsv2rgb(hsv[0],hsv[1],hsv[2]));
    commitColor(hex);hexIn.value=hex;checks(hex);prevColor(hex);
  });
  hexIn.addEventListener('change',function(){
    var v=hexIn.value.trim();if(v[0]!=='#')v='#'+v;
    if(/^#[0-9a-f]{6}$/i.test(v)){commitColor(v.toLowerCase());sync()}else hexIn.value=getC();
  });
  wheelBtn.addEventListener('click',function(){
    wrap.hidden=!wrap.hidden;
    if(!wrap.hidden){drawWheel();placeMarker()}
  });
  thick.addEventListener('input',function(){
    var w=parseFloat(thick.value);commitWidth(w);prevWidth(w);
  });
  panels[kind]={sync:function(){sync()}};
  sync();
}

async function openFile(file){
  if(!pdfjsLib){showEmptyMsg('The PDF engine could not load. Check your connection and reload.',true);return}
  if(!/pdf/i.test(file.type)&&!/\.pdf$/i.test(file.name)){showEmptyMsg('That isn’t a PDF. Choose a file ending in .pdf.',true);return}
  showEmptyMsg('Opening '+file.name+'…',false);
  try{
    var buf=await file.arrayBuffer();
    closeDoc();
    S.bytes=new Uint8Array(buf);
    var task=pdfjsLib.getDocument({data:S.bytes.slice(),isEvalSupported:false});
    task.onPassword=function(cb,reason){
      ask({title:'Password required',text:reason===2?'That password didn’t work. Try again.':'This PDF is password protected.',type:'password',ok:'Open'}).then(function(pw){
        if(pw===null){task.destroy();showEmptyMsg('Choose a PDF to open.',false)}else cb(pw);
      });
    };
    var pdf=await task.promise;
    S.pdf=pdf;S.name=file.name;
    document.title=file.name+' – PDF Viewer';

function layout(){

},true);
stage.addEventListener('scroll',positionBar);
window.addEventListener('resize',positionBar);

/* ------------------------------------------------------------ zoom, fit, rotate, views */
function setScale(n){S.fit='custom';S.scale=n;layout();toast(Math.round(n*100)+'%')}
function zoomBy(dir){
  var s=S.scale,n;
  if(dir>0)n=STEPS.filter(function(x){return x>s*1.01})[0]||5;
  else n=STEPS.slice().reverse().filter(function(x){return x<s*.99})[0]||.25;
  setScale(n);
}
$('#btnZoomIn').addEventListener('click',function(){zoomBy(1)});
$('#btnZoomOut').addEventListener('click',function(){zoomBy(-1)});
function updateFitButton(){
  var b=$('#btnFit');
  var next=S.fit==='width'?'Fit to page':'Fit to page width';
  b.title=next;b.setAttribute('aria-label',next);
}
$('#btnFit').addEventListener('click',function(){
  S.fit=(S.fit==='width')?'page':'width';layout();
  toast(S.fit==='width'?'Fit to page width':'Fit to page');
});
$('#btnTwo').addEventListener('click',function(){
  S.two=!S.two;this.setAttribute('aria-pressed',String(S.two));layout();
});
$('#btnRotate').addEventListener('click',function(){
  S.rot=(S.rot+90)%360;
  S.pages.forEach(function(p){
    p.strokes.forEach(function(s){s.pts=s.pts.map(function(q){return [1-q[1],q[0]]})});
    p.texts.forEach(function(t){if(t.w)t.w=Math.min(.95,t.w*p.cssW/p.cssH);if(t.h)t.h=Math.min(.95,t.h*p.cssH/p.cssW);var x=t.x,y=t.y;t.x=clamp(1-y-.04,0,.98);t.y=clamp(x,0,.98);t.el.style.left=(t.x*100)+'%';t.el.style.top=(t.y*100)+'%'});
  });
  layout();buildThumbs();
});
var wheelT=0;
stage.addEventListener('wheel',function(e){
  if(!(e.ctrlKey||e.metaKey)||!S.pdf)return;
  e.preventDefault();
  var now=Date.now();if(now-wheelT<70)return;wheelT=now;
  zoomBy(e.deltaY<0?1:-1);
},{passive:false});

var rzT;
new ResizeObserver(function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){if(S.pdf&&S.fit!=='custom')layout()},120);
}).observe(stage);

/* ------------------------------------------------------------ page navigation */
function goTo(n,smooth){
  if(!S.pdf)return;
  n=clamp(Math.round(n)||1,1,S.pages.length);
  var p=S.pages[n-1];
  stage.scrollTo({top:Math.max(0,p.wrap.offsetTop-8),behavior:smooth?'smooth':'auto'});
  setCurrent(n);
}
function setCurrent(n){
  if(n===S.cur&&pageIn.value==n)return;
  S.cur=n;
  if(document.activeElement!==pageIn)pageIn.value=n;
  markThumb();
}
pageIn.addEventListener('change',function(){goTo(parseInt(pageIn.value,10),false);pageIn.value=S.cur});
pageIn.addEventListener('keydown',function(e){if(e.key==='Enter'){pageIn.blur();stage.focus({preventScroll:true})}});
pageIn.addEventListener('focus',function(){pageIn.select()});

var scrollRaf=0;
stage.addEventListener('scroll',function(){
  if(scrollRaf)return;
  scrollRaf=requestAnimationFrame(function(){
    scrollRaf=0;
    if(!S.pages.length)return;
    var mid=stage.scrollTop+stage.clientHeight*.35,found=S.pages.length;
    for(var i=0;i<S.pages.length;i++){
      var w=S.pages[i].wrap;
      if(w.offsetTop+w.offsetHeight>mid){found=i+1;break}
    }
    setCurrent(found);
  });
});

/* ------------------------------------------------------------ sidebar */
var side=$('#side'),sideTab='thumbs';
$('#btnSide').addEventListener('click',function(){
  side.hidden=!side.hidden;this.setAttribute('aria-pressed',String(!side.hidden));
  if(!side.hidden)markThumb(true);
  if(S.fit!=='custom')setTimeout(layout,30);
});
function setTab(t){
  sideTab=t;
  $('#tabOutline').setAttribute('aria-selected',String(t==='outline'));
  $('#tabThumbs').setAttribute('aria-selected',String(t==='thumbs'));
  $('#outline').hidden=t!=='outline';$('#thumbs').hidden=t!=='thumbs';
}
$('#tabOutline').addEventListener('click',function(){setTab('outline')});
$('#tabThumbs').addEventListener('click',function(){setTab('thumbs')});

var thumbIO=new IntersectionObserver(function(es){
  es.forEach(function(e){
    if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done='1';renderThumb(e.target)}
  });
},{root:$('#sideBody'),rootMargin:'300px 0px'});

function buildThumbs(){
  if(!S.pdf)return;
  var box=$('#thumbs');box.innerHTML='';thumbIO.disconnect();
  S.pages.forEach(function(p,i){
    var vp=p.page.getViewport({scale:1,rotation:totalRot(p)});
    var w=140,h=Math.round(w*vp.height/vp.width);
    var b=document.createElement('button');b.type='button';b.className='thumb';b.dataset.page=i+1;
    b.setAttribute('aria-label','Go to page '+(i+1));
    var c=document.createElement('canvas');c.style.width=w+'px';c.style.height=h+'px';c.width=w;c.height=h;
    var l=document.createElement('span');l.textContent=i+1;
    b.append(c,l);b._p=p;
    b.addEventListener('click',function(){goTo(i+1,false);if(innerWidth<=760){side.hidden=true;$('#btnSide').setAttribute('aria-pressed','false')}});
    box.appendChild(b);thumbIO.observe(b);
  });
  markThumb();
}
async function renderThumb(b){
  var p=b._p,gen=S.gen;
  try{
    var c=b.querySelector('canvas'),dpr=dprNow();
    var base=p.page.getViewport({scale:1,rotation:totalRot(p)});
    var sc=140/base.width,vp=p.page.getViewport({scale:sc*dpr,rotation:totalRot(p)});
    c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    await p.page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }catch(e){if(gen===S.gen)console.warn(e)}
}
function markThumb(scroll){
  document.querySelectorAll('.thumb').forEach(function(b){
    var on=+b.dataset.page===S.cur;
    if(on)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');
    if(on&&!side.hidden&&sideTab==='thumbs'&&scroll!==false){
      var sb=$('#sideBody'),r=b.getBoundingClientRect(),sr=sb.getBoundingClientRect();
      if(r.top<sr.top||r.bottom>sr.bottom)sb.scrollTop+=r.top-sr.top-40;
    }
  });
}
async function buildOutline(){
  var box=$('#outline'),gen=S.gen;box.innerHTML='';
  var o=null;try{o=await S.pdf.getOutline()}catch(e){}
  if(gen!==S.gen)return;
  if(!o||!o.length){
    box.innerHTML='<div class="note-empty">This document has no table of contents. Use Pages to browse.</div>';
    $('#tabOutline').disabled=false;setTab('thumbs');return;
  }
  function list(items,depth){
    var ul=document.createElement('ul');
    items.forEach(function(it){
      var li=document.createElement('li');
      var b=document.createElement('button');b.type='button';b.textContent=it.title||'Untitled';b.style.paddingLeft=(6+depth*14)+'px';
      b.addEventListener('click',async function(){
        try{
          var d=it.dest;if(typeof d==='string')d=await S.pdf.getDestination(d);
          if(d&&d[0]!=null){var idx=typeof d[0]==='object'?await S.pdf.getPageIndex(d[0]):d[0];goTo(idx+1,false)}
        }catch(e){toast('That link couldn’t be followed')}
      });
      li.appendChild(b);if(it.items&&it.items.length)li.appendChild(list(it.items,depth+1));
      ul.appendChild(li);
    });
    return ul;
  }
  box.appendChild(list(o,0));setTab('outline');
}

/* ------------------------------------------------------------ find */
var hits={list:[],cur:-1,tok:0,q:''};
var findEl=$('#find'),findIn=$('#findIn'),findCnt=$('#findCnt');
function openFind(){
  if(!S.pdf)return;
  findEl.hidden=false;findIn.focus();findIn.select();
}
function closeFind(){
  findEl.hidden=true;hits.list=[];hits.cur=-1;hits.tok++;findIn.value='';findCnt.textContent='';
  S.pages.forEach(applyHits);stage.focus({preventScroll:true});
}
$('#btnFind').addEventListener('click',function(){findEl.hidden?openFind():closeFind()});
$('#findClose').addEventListener('click',closeFind);
$('#findNext').addEventListener('click',function(){stepHit(1)});
$('#findPrev').addEventListener('click',function(){stepHit(-1)});
var findT;
findIn.addEventListener('input',function(){clearTimeout(findT);findT=setTimeout(runFind,200)});
findIn.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();clearTimeout(findT);if(findIn.value.trim().toLowerCase()!==hits.q)runFind();else stepHit(e.shiftKey?-1:1)}
  if(e.key==='Escape')closeFind();
});
function updateCount(){
  if(!findIn.value.trim()){findCnt.textContent='';return}
  findCnt.textContent=hits.list.length?(hits.cur+1)+' of '+hits.list.length:'No results';
}
function lastIdx(offs,pos){
  var lo=0,hi=offs.length-1,r=0;
  while(lo<=hi){var m=(lo+hi)>>1;if(offs[m]<=pos){r=m;lo=m+1}else hi=m-1}
  return r;
}
async function runFind(){
  var q=findIn.value.trim().toLowerCase().replace(/\s+/g,' ');
  var tok=++hits.tok;hits.list=[];hits.cur=-1;hits.q=q;
  S.pages.forEach(applyHits);
  if(!q){updateCount();return}
  findCnt.textContent='Searching…';
  var found=[];
  for(var i=0;i<S.pages.length;i++){
    var p=S.pages[i];
    if(!p.items){var tc=await p.page.getTextContent();p.items=tc.items.map(function(it){return it.str})}
    if(tok!==hits.tok)return;
    var offs=[],joined='';
    p.items.forEach(function(s){offs.push(joined.length);joined+=s+' '});
    var low=joined.toLowerCase(),from=0,pos;
    while((pos=low.indexOf(q,from))>-1){
      var end=pos+q.length;
      found.push({page:i,a:lastIdx(offs,pos),b:lastIdx(offs,end-1)});
      from=end;
    }
  }
  if(tok!==hits.tok)return;
  hits.list=found;
  if(found.length){
    var k=0;while(k<found.length&&found[k].page+1<S.cur)k++;
    hits.cur=k<found.length?k:0;
    S.pages.forEach(applyHits);
    updateCount();showHit();
  }else updateCount();
}
function stepHit(d){
  if(!hits.list.length){if(findIn.value.trim())runFind();return}
  hits.cur=(hits.cur+d+hits.list.length)%hits.list.length;
  S.pages.forEach(applyHits);updateCount();showHit();
}
async function showHit(){
  var h=hits.list[hits.cur];if(!h)return;
  var p=S.pages[h.page];
  goTo(h.page+1,false);
  await ensure(p);
  applyHits(p);
  var d=p.divs[h.a];
  if(d&&hits.list[hits.cur]===h)d.scrollIntoView({block:'center',inline:'nearest'});
}
function applyHits(p){
  if(!p.divs||!p.divs.length)return;
  p.divs.forEach(function(d){d.classList.remove('hit','cur')});
  hits.list.forEach(function(h,idx){
    if(h.page!==p.i)return;
    for(var k=h.a;k<=h.b;k++){var d=p.divs[k];if(d)d.classList.add(idx===hits.cur?'cur':'hit')}
  });
}

/* ------------------------------------------------------------ read aloud */
$('#btnRead').addEventListener('click',async function(){
  var b=this;
  if(!('speechSynthesis' in window)){toast('Read aloud isn’t available in this browser');return}
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();b.setAttribute('aria-pressed','false');return}
  var p=S.pages[S.cur-1];if(!p)return;
  var tc=await p.page.getTextContent();
  var text=tc.items.map(function(i){return i.str}).join(' ').replace(/\s+/g,' ').trim();
  if(!text){toast('No readable text on this page');return}
  var u=new SpeechSynthesisUtterance(text);
  u.onend=u.onerror=function(){b.setAttribute('aria-pressed','false')};
  b.setAttribute('aria-pressed','true');speechSynthesis.speak(u);
});

/* ------------------------------------------------------------ print */
$('#btnPrint').addEventListener('click',printDoc);
async function printDoc(){
  if(!S.pdf)return;
  toast('Preparing to print…');
  var area=$('#printArea');area.innerHTML='';
  try{
    for(var i=0;i<S.pages.length;i++){
      var p=S.pages[i],ps=2;
      var vp=p.page.getViewport({scale:ps,rotation:totalRot(p)});
      var c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
      var ctx=c.getContext('2d');
      await p.page.render({canvasContext:ctx,viewport:vp}).promise;
      drawStrokes(ctx,p,c.width,c.height,ps);
      p.texts.forEach(function(t){
        var fs=t.size*ps,stack=FONTS[t.font||'sans'];
        ctx.save();ctx.fillStyle=t.color;ctx.strokeStyle=t.color;
        ctx.font=(t.italic?'italic ':'')+(t.bold?'bold ':'')+fs+'px '+stack;ctx.textBaseline='alphabetic';
        noteLines(t).forEach(function(line,li){
          var x=t.x*c.width+t.size*.2*ps,y=t.y*c.height+(t.size*.06+t.size*.95+li*t.size*1.2)*ps;
          ctx.fillText(line,x,y);
          var w=ctx.measureText(line).width;ctx.lineWidth=Math.max(1,fs*.06);
          if(t.underline&&line){ctx.beginPath();ctx.moveTo(x,y+fs*.12);ctx.lineTo(x+w,y+fs*.12);ctx.stroke()}
          if(t.strike&&line){ctx.beginPath();ctx.moveTo(x,y-fs*.3);ctx.lineTo(x+w,y-fs*.3);ctx.stroke()}
        });
        ctx.restore();
      });
      area.appendChild(c);
    }
    var clean=function(){area.innerHTML='';window.removeEventListener('afterprint',clean)};
    window.addEventListener('afterprint',clean);
    window.print();
  }catch(e){console.error(e);toast('Printing isn’t available here. Use Save, then print the file.')}
}

/* ------------------------------------------------------------ save */
async function buildPdfBytes(){
  var has=S.pages.some(function(p){return p.strokes.length||p.texts.length});
  if(!has||!window.PDFLib)return {bytes:S.bytes,annotated:false};
  var L=PDFLib;
  var doc=await L.PDFDocument.load(S.bytes,{ignoreEncryption:true});
  if(window.fontkit)doc.registerFontkit(window.fontkit);
  var FN={sans:['Helvetica','HelveticaBold','HelveticaOblique','HelveticaBoldOblique'],serif:['TimesRoman','TimesRomanBold','TimesRomanItalic','TimesRomanBoldItalic'],mono:['Courier','CourierBold','CourierOblique','CourierBoldOblique']};
  function fontKey(t){return isCustom(t)?t.font:FN[t.font||'sans'][(t.bold?1:0)+(t.italic?2:0)]}
  var fonts={},fb={},fontIssue=false;
  for(var pi=0;pi<S.pages.length;pi++){
    for(var ti=0;ti<S.pages[pi].texts.length;ti++){
      var fk=fontKey(S.pages[pi].texts[ti]);
      if(!fonts[fk]){
        if(fk.indexOf('c:')===0){
          try{fonts[fk]=await doc.embedFont(S.fonts[fk].bytes,{subset:true})}
          catch(e){fonts[fk]=await doc.embedFont(L.StandardFonts.Helvetica);fb[fk]=true}
        }else fonts[fk]=await doc.embedFont(L.StandardFonts[fk]);
      }
    }
  }
  var pdfPages=doc.getPages();
  function hex(c){return L.rgb(parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255)}
  S.pages.forEach(function(p,i){
    if(!p.strokes.length&&!p.texts.length)return;
    var pg=pdfPages[i];if(!pg)return;
    var sz=pg.getSize(),w=sz.width,h=sz.height,R=totalRot(p);
    var Wd=R%180?h:w,Hd=R%180?w:h;
    function map(u,v){
      var px,pyt;
      if(R===0){px=u;pyt=v}
      else if(R===90){px=v;pyt=h-u}
      else if(R===180){px=w-u;pyt=h-v}
      else{px=w-v;pyt=u}
      return {x:px,y:h-pyt};
    }
    p.strokes.forEach(function(s){
      var pts=s.pts.map(function(q){return map(q[0]*Wd,q[1]*Hd)});
      if(pts.length===1)pts.push({x:pts[0].x+.01,y:pts[0].y});
      for(var k=1;k<pts.length;k++){
        pg.drawLine({start:pts[k-1],end:pts[k],thickness:s.w,color:hex(s.color),opacity:s.hl?.4:1,lineCap:s.hl?L.LineCapStyle.Butt:L.LineCapStyle.Round});
      }
    });
    p.texts.forEach(function(t){
      var fnt=fonts[fontKey(t)];
      noteLines(t).forEach(function(line,li){
        var safe=(isCustom(t)&&!fb[fontKey(t)])?line:line.replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
        if(!safe.trim())return;
        var u0=t.x*Wd+t.size*.2,v0=t.y*Hd+t.size*.06+t.size*.95+li*t.size*1.2;
        var pt=map(u0,v0);
        try{
        pg.drawText(safe,{x:pt.x,y:pt.y,size:t.size,font:fnt,color:hex(t.color),rotate:L.degrees(R)});
        var wd=fnt.widthOfTextAtSize(safe,t.size);
        function rule(dv){pg.drawLine({start:map(u0,v0+dv),end:map(u0+wd,v0+dv),thickness:Math.max(.4,t.size*.06),color:hex(t.color)})}
        if(t.underline)rule(t.size*.12);
        if(t.strike)rule(-t.size*.3);
        }catch(e){fontIssue=true}
      });
    });
  });
  return {bytes:await doc.save(),annotated:true,fontFallback:fontIssue||Object.keys(fb).length>0};
}
async function savePdf(name){
  if(!S.pdf)return;
  var res;
  try{res=await buildPdfBytes()}catch(e){console.error(e);res={bytes:S.bytes,annotated:false,failed:true}}
  var base=(name||S.name||'document.pdf').replace(/\.pdf$/i,'');
  var fname=name?base+'.pdf':(res.annotated?base+' (annotated).pdf':base+'.pdf');
  var dl=null;
  try{dl=await claude.use('downloads')}catch(e){}
  if(!dl){
    try{
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([res.bytes],{type:'application/pdf'}));a.download=fname;
      document.body.appendChild(a);a.click();a.remove();toast('Saved '+fname);
    }catch(e){toast('Saving isn’t available in this view')}
    return;
  }
  try{
    await dl.save({filename:fname,data:new Blob([res.bytes],{type:'application/pdf'})});
    toast(res.failed?'Saved without annotations':res.fontFallback?'Saved. An added font couldn’t be embedded, so some text may look different.':'Saved '+fname);
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('Couldn’t save the file');
  }
}
$('#btnSave').addEventListener('click',function(){savePdf()});
$('#btnSaveAs').addEventListener('click',async function(){
  if(!S.pdf)return;
  var n=await ask({title:'Save as',text:'Name for the new PDF.',value:S.name.replace(/\.pdf$/i,'')+' copy.pdf',ok:'Save'});
  if(n&&n.trim())savePdf(n.trim().replace(/[\\/:*?"<>|]/g,'-'));
});

/* ------------------------------------------------------------ full screen */
$('#btnFull').addEventListener('click',async function(){
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){toast('Full screen isn’t available here')}
});

/* ------------------------------------------------------------ keyboard */
document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(e.key==='Escape'){closeMenus();if(S.tool&&!findEl.contains(document.activeElement))setTool(S.tool,false)}
  if(!S.pdf)return;
  var typing=e.target&&(e.target.isContentEditable||e.target.tagName==='INPUT');
  if(mod&&k==='f'){e.preventDefault();openFind()}
  else if(mod&&k==='s'){e.preventDefault();savePdf()}
  else if(mod&&k==='p'){e.preventDefault();printDoc()}
  else if(mod&&k==='z'&&!typing){e.preventDefault();undo()}
  else if(mod&&(k==='='||k==='+')){e.preventDefault();zoomBy(1)}
  else if(mod&&k==='-'){e.preventDefault();zoomBy(-1)}
  else if(mod&&k==='0'){e.preventDefault();setScale(1)}
  else if(!typing&&!mod){
    if(e.key==='ArrowRight'&&!e.altKey)goTo(S.cur+1,false);
    else if(e.key==='ArrowLeft'&&!e.altKey)goTo(S.cur-1,false);
  }
});

showEmptyMsg('Drop a file here, or choose one from your device. It stays in your browser.',false);
if(!pdfjsLib)showEmptyMsg('The PDF engine could not load. Check your connection and reload.',true);
})();
